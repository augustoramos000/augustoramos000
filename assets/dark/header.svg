<svg viewBox="0 0 1000 318" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --c: #FFFFFF; }
    
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .dot { animation: p 2.4s ease-in-out infinite; }
    @keyframes p { 0%,100%{opacity:1} 50%{opacity:.35} }
    .ring { animation: r 2.4s ease-out infinite; transform-origin: 60px 60px; }
    @keyframes r { 0%{transform:scale(.4);opacity:.8} 80%,100%{transform:scale(2.6);opacity:0} }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.55s} .a4{animation-delay:.75s}
    .a5{animation-delay:.95s} .a6{animation-delay:1.15s} .a7{animation-delay:1.35s} .a8{animation-delay:1.55s} .a9{animation-delay:1.75s}
    @media (prefers-reduced-motion: reduce) {
      .draw,.rise,.fade,.dot,.ring { animation: none; }
      .draw{stroke-dashoffset:0} .rise,.fade{opacity:1} .ring{opacity:0}
    }
    
  </style>

  <line class="draw a1" x1="48" y1="58" x2="952" y2="58" stroke="var(--c)" stroke-width="1"/>
  <g class="fade a1">
    <text class="mono" x="48" y="44" font-size="11" fill="var(--c)" letter-spacing="3.5">PORTFOLIO — INDEX Nº 001</text>
    <text class="mono" x="952" y="44" font-size="11" fill="var(--c)" letter-spacing="3.5" text-anchor="end">GITHUB — @augustoramos000</text>
  </g>
  <g class="rise a2"><text class="mono" x="46" y="176" font-size="72" fill="var(--c)" letter-spacing="-2">Augusto Ramos</text></g>
  <g class="fade a3"><text class="mono" x="48" y="214" font-size="19" fill="var(--c)">Estudante de Engenharia de Software.</text></g>
  <line class="draw a4" x1="48" y1="258" x2="952" y2="258" stroke="var(--c)" stroke-width="1"/>
  <g class="fade a5">
    <text class="mono" x="48" y="290" font-size="11.5" fill="var(--c)" letter-spacing="3">JAVASCRIPT</text>
    <text class="mono" x="170" y="290" font-size="11.5" fill="var(--c)">·</text>
    <text class="mono" x="196" y="290" font-size="11.5" fill="var(--c)" letter-spacing="3">TYPESCRIPT</text>
    <text class="mono" x="326" y="290" font-size="11.5" fill="var(--c)">·</text>
    <text class="mono" x="352" y="290" font-size="11.5" fill="var(--c)" letter-spacing="3">REACT</text>
    <text class="mono" x="430" y="290" font-size="11.5" fill="var(--c)">·</text>
    <text class="mono" x="456" y="290" font-size="11.5" fill="var(--c)" letter-spacing="3">NODE</text>
    <text class="mono" x="526" y="290" font-size="11.5" fill="var(--c)">·</text>
    <text class="mono" x="552" y="290" font-size="11.5" fill="var(--c)" letter-spacing="3">PYTHON</text>
    <text class="mono" x="952" y="290" font-size="11.5" fill="var(--c)" letter-spacing="3" text-anchor="end">ENG. DE SOFTWARE</text>
  </g>
</svg>
